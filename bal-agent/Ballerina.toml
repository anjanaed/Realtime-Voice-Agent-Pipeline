[package]
org = "voice_agent"
name = "llm_service"
version = "0.1.0"
distribution = "2201.13.2"

[build-options]
observabilityIncluded = true

[[dependency]]
org = "ballerina"
name = "ai"
version = "1.7.1"

[[dependency]]
org = "ballerinax"
name = "ai.openai"
version = "1.3.4"

# The WebSocket layer lives in modules/voice, vendored from "../WS Listener" so
# this package builds anywhere without a pre-seeded local repository. Refresh it
# with ./sync-listener.sh; do not edit modules/voice by hand.
[[dependency]]
org = "ballerina"
name = "websocket"
version = "2.15.1"

[[dependency]]
org = "ballerina"
name = "http"
version = "2.16.0"

[[dependency]]
org = "ballerina"
name = "uuid"
version = "1.10.0"

[[dependency]]
org = "ballerina"
name = "log"
version = "2.12.0"
