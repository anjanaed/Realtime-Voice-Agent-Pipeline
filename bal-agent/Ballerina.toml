[package]
org = "voice_agent"
name = "llm_service"
version = "0.1.0"
distribution = "2201.13.2"

[build-options]
observabilityIncluded = true

[[dependency]]
org = "ballerina"
name = "ai"
version = "1.7.1"

[[dependency]]
org = "ballerinax"
name = "ai.openai"
version = "1.3.4"

# The WebSocket layer lives in modules/voice, vendored from "../WS Listener" so
# this package builds anywhere without a pre-seeded local repository. Refresh it
# with ./sync-listener.sh; do not edit modules/voice by hand.
#
# http, uuid and log are deliberately NOT pinned here. They are pulled in
# transitively, and naming them as direct dependencies at a fixed version forces
# extra versions into the resolution graph -- which fails on registries that do
# not carry every intermediate release.
[[dependency]]
org = "ballerina"
name = "websocket"
version = "2.15.1"
